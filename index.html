<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Someone Special 💖</title>
  <link rel="icon" type="image/png" href="images/Pink_Heart64_Favicon.png">
  <!-- Pixel/retro font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink: #f9a8d4;
      --lav:  #c4b5fd;
      --cyan: #a5f3fc;
      --white:#ffffff;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#fff;
      text-align:center;
      overflow:hidden;
      padding:16px;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:2;
    }

    .heart{
      width:64px;
      height:64px;
      background:url('images/Pink_Heart64.png') no-repeat center/contain;
      image-rendering: pixelated;
      cursor:pointer;
      animation: beat 1.5s infinite ease-in-out;
      transition: transform .2s;
      z-index:2;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
    }
    .heart.clicked{
      animation: beat-fast .4s infinite ease-in-out;
      transform: scale(1.2);
    }
    @keyframes beat{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.1)}
    }
    @keyframes beat-fast{
      0%,100%{transform:scale(1.1)}
      50%{transform:scale(1.3)}
    }

    .hint{
      margin-top:10px;
      font-size:.9rem;
      opacity:.85;
    }

    /* Dialog */
    .dialog{
      position:fixed;
      left:12px;
      right:12px;
      bottom:16px;
      margin:0 auto;
      max-width:720px;
      background: linear-gradient(180deg, rgba(120,120,130,0.65), rgba(150,150,160,0.75));
      color:#fff;
      text-align:left;
      padding:16px 18px;
      line-height:1.6;
      border:4px solid var(--white);
      border-radius:10px;
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.20) inset,
        0 0 0 8px rgba(255,255,255,0.10) inset,
        0 6px 0 rgba(0,0,0,0.15);
      z-index:3;
    }
    .dialog::before{
      content:"";
      position:absolute;
      top:-4px; left:-4px; right:-4px;
      height:6px;
      background: linear-gradient(90deg, var(--pink), var(--lav), var(--cyan));
      border-top-left-radius:8px;
      border-top-right-radius:8px;
    }
    .dialog::after{
      content:"";
      position:absolute;
      left:24px;
      bottom:-10px;
      width:0; height:0;
      border-left:10px solid transparent;
      border-right:10px solid transparent;
      border-top:10px solid rgba(150,150,160,0.75);
      filter: drop-shadow(0 -2px 0 rgba(255,255,255,0.9));
    }

    .speaker{
      font-family:'Press Start 2P', monospace;
      font-size:.7rem;
      letter-spacing:.02em;
      margin-bottom:10px;
      color: #fefefe;
      text-shadow: 0 1px 0 rgba(0,0,0,.6);
    }

    #message{
      font-family:'Press Start 2P', monospace;
      font-size:.8rem;
      white-space:pre-wrap;
      overflow:hidden;
      border-right: 3px solid rgba(255,255,255,0.75);
      animation: blinkCursor .9s step-end infinite;
      min-height:1.4em;
      transition: opacity .25s ease;
      opacity: 1;
    }
    .hidden{ opacity: 0; }

    @keyframes blinkCursor{
      0%,100%{border-color:transparent}
      50%{border-color:rgba(255,255,255,.85)}
    }

    /* Starry sky */
    .sky{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star{
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,1) 50%, rgba(255,255,255,0) 80%);
      opacity: 0.9;
      filter: drop-shadow(0 0 8px rgba(255,255,255,1))
              drop-shadow(0 0 12px rgba(200,230,255,0.8));
      animation: twinkle var(--twinkle, 2.6s) ease-in-out infinite;
    }
    .star.s2{ width: 4px; height: 4px; opacity: 1; }
    .star.s3{ width: 2px; height: 2px; opacity: 0.7; }
    @keyframes twinkle{
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50%      { opacity: 1;  transform: scale(1.2); }
    }
    .shooting{
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 6px 2px rgba(255,255,255,0.9),
        -18px 0 2px -1px rgba(255,255,255,0.35),
        -36px 0 2px -2px rgba(255,255,255,0.2);
      opacity: 0;
      transform: rotate(-18deg);
      animation: shoot 1.2s ease-out forwards;
      will-change: transform, opacity;
    }
    @keyframes shoot{
      0%   { opacity: 0; transform: translate3d(0,0,0) rotate(-18deg); }
      10%  { opacity: 1; }
      100% { opacity: 0; transform: translate3d(320px, -120px, 0) rotate(-18deg); }
    }

    /* Music toggle button */
    .audio-toggle{
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 4;
      border: 2px solid rgba(255,255,255,.9);
      background: rgba(255,255,255,.15);
      color: #fff;
      backdrop-filter: blur(6px);
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease;
    }
    .audio-toggle:hover{ transform: translateY(-1px); }
    .audio-toggle[aria-pressed="true"]{ background: rgba(255,255,255,.25); }
  </style>
</head>
<body>

  <div class="sky" aria-hidden="true"></div>
  <!-- Music toggle -->
  <button class="audio-toggle" id="audioToggle" aria-pressed="false" title="Music">🎵</button>

  <div class="stage">
    <div class="heart" id="heart" aria-label="Tap to start or show next message"></div>
    <div class="hint">tap the heart</div>
  </div>

  <div class="dialog" role="region" aria-live="polite" aria-label="Message">
    <div class="speaker">Cyan..</div>
    <div id="message"></div>
  </div>

  <script>
    /* ===== Messages (cycles with each heart tap) ===== */
    const messages = [
`Did you know the stars look softer when I think of you?`,

`Even on the darkest nights, the moon shines brightest — guiding me home through the quiet.`,

`You are my guiding moonlight —
graceful and luminous, you radiate a warmth that keeps the cold away`,

`The rivers remember your name,
and even the stars slow their drift to listen.`,

`And I, will always follow the glisten of your waters,
forever spellbound by your light...`,

`I Love You, My Pretty River Nymph...`
];

    /* ===== Typewriter & Heart ===== */
    const heart = document.getElementById("heart");
    const messageEl = document.getElementById("message");

    let msgIndex = 0;   // which message
    let charIndex = 0;  // position within the message
    let typing = false;
    let started = false;

    // Helper: variable delay (slower for final message, pauses on punctuation)
    function getTypeDelay(prevChar, isFinal){
      const base = isFinal ? 90 : 50; // last line slower
      if (",;".includes(prevChar)) return base + 100;
      if (".!?…".includes(prevChar)) return base + 200;
      if (prevChar === "—") return base + 120;
      return base;
    }

    function typeMessage(text){
      if(charIndex < text.length){
        messageEl.textContent += text.charAt(charIndex++);
        const prev = text.charAt(charIndex - 1);
        const delay = getTypeDelay(prev, msgIndex === messages.length - 1);
        setTimeout(()=>typeMessage(text), delay);
      }else{
        messageEl.style.borderRight = 'none';
        typing = false;
      }
    }

    function showCurrentMessage(){
      typing = true;
      messageEl.classList.add('hidden');           // fade out previous
      messageEl.style.borderRight = '3px solid rgba(255,255,255,0.75)';

      setTimeout(()=>{
        messageEl.textContent = '';                // clear
        messageEl.classList.remove('hidden');      // fade back in
        charIndex = 0;
        typeMessage(messages[msgIndex]);
      }, 200);
    }

    heart.addEventListener("click", ()=>{
      heart.classList.toggle("clicked");

      if(!started){
        started = true;
        msgIndex = 0;
        showCurrentMessage();
        return;
      }
      if(typing) return;

      msgIndex = (msgIndex + 1) % messages.length;
      showCurrentMessage();
    });

    /* ===== Stars ===== */
    const sky = document.querySelector('.sky');
    function makeStars(count = 80){
      const { innerWidth: w, innerHeight: h } = window;
      const frag = document.createDocumentFragment();
      for(let i=0;i<count;i++){
        const s = document.createElement('div');
        s.className = 'star';
        const r = Math.random();
        if(r > 0.7) s.classList.add('s2');
        else if(r < 0.2) s.classList.add('s3');
        s.style.left = Math.random()*w + 'px';
        s.style.top  = Math.random()*h + 'px';
        const dur = (1.8 + Math.random()*2.2).toFixed(2) + 's';
        s.style.setProperty('--twinkle', dur);
        s.style.animationDelay = (Math.random()*2.5).toFixed(2) + 's';
        frag.appendChild(s);
      }
      sky.appendChild(frag);
    }
    function shootStar(){
      const { innerWidth: w, innerHeight: h } = window;
      const count = Math.floor(Math.random()*2) + 2; // 2–3 per wave
      for(let i=0; i<count; i++){
        const st = document.createElement('div');
        st.className = 'shooting';
        const startX = Math.random() * (w * 0.6);
        const startY = h * 0.4 + Math.random() * (h * 0.5);
        st.style.left = startX + 'px';
        st.style.top  = startY + 'px';
        st.style.animationDelay = (Math.random() * 0.5) + 's';
        sky.appendChild(st);
        st.addEventListener('animationend', ()=> st.remove(), { once: true });
      }
      const nextIn = 2500 + Math.random()*4000;
      setTimeout(shootStar, nextIn);
    }
    makeStars(80);
    setTimeout(shootStar, 3000);

    let starTimer;
    window.addEventListener('resize', ()=>{
      clearTimeout(starTimer);
      starTimer = setTimeout(()=>{
        sky.innerHTML = '';
        makeStars(80);
      }, 250);
    });

    /* ===== Music (plays on first heart tap) ===== */
    const audioToggle = document.getElementById('audioToggle');
    const music = new Audio('music/Washmypainaway.mp3');  // ensure exact path/case
    music.loop = true;
    music.preload = 'auto';

    let musicOn = false; // start OFF; first heart tap will start it
    function updateToggleUI(){
      audioToggle.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
      audioToggle.textContent = musicOn ? '🔊' : '🎵';
    }
    updateToggleUI();

    function fadeVolume(target, step = 0.05, interval = 60){
      clearInterval(music._fadeTimer);
      music._fadeTimer = setInterval(()=>{
        const v = music.volume + (target > music.volume ? step : -step);
        music.volume = Math.max(0, Math.min(1, v));
        if ((target > 0 && music.volume >= target) || (target === 0 && music.volume <= 0)){
          clearInterval(music._fadeTimer);
          if (target === 0) music.pause();
        }
      }, interval);
    }
    async function ensurePlayback(){
      try { if (music.paused) { await music.play(); } } catch(e) {}
    }

    let startedFromHeart = false;
    heart.addEventListener('click', async ()=>{
      if (!startedFromHeart){
        startedFromHeart = true;
        await ensurePlayback();
        music.volume = 0;
        fadeVolume(0.6);     // adjust loudness here (0.3–0.7 nice)
        musicOn = true;
        updateToggleUI();
      }
    });

    audioToggle.addEventListener('click', async ()=>{
      if (!musicOn){
        await ensurePlayback();
        music.volume = 0;
        fadeVolume(0.6);     // keep in sync with above
        musicOn = true;
      } else {
        fadeVolume(0);
        musicOn = false;
      }
      updateToggleUI();
    });
  </script>
</body>
</html>
